<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a33" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Time Keeper">
  <meta name="description" content="Track your shifts and breaks, and see what you earned each pay period.">
  <title>Time Keeper</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5"/><path d="M16 3.5a12.5 12.5 0 0 1 11.6 7.8"/><circle cx="27.1" cy="11" r="2.4"/></svg>
      <span>Time Keeper</span>
    </div>
    <div class="topbar-actions">
      <button class="sync-pill" id="sync-pill" data-sync="off" aria-label="Sync settings">
        <span class="sync-dot"></span><span id="sync-text">Not synced</span>
      </button>
      <button class="icon-btn" id="open-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <div class="tab-indicator" aria-hidden="true"></div>
    <button class="tab active" data-tab="clock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Clock</span>
    </button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
      <span>Days</span>
    </button>
    <button class="tab" data-tab="pay">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span>Pay</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
